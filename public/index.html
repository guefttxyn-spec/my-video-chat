<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BogdanBOG</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">Bogdan<span>BOG</span></div>
            <div class="stats">Онлайн: <span id="online-count">0</span></div>
        </header>

        <div class="main-box">
            <div id="setup-screen">
                <div class="form">
                    <label>Вы:</label>
                    <div class="row">
                        <select id="myGender"><option value="male">Парень</option><option value="female">Девушка</option></select>
                        <select id="myAge"><option value="1">до 18</option><option value="2">18-25</option><option value="3">25+</option></select>
                    </div>
                    <label>Искать:</label>
                    <div class="row">
                        <select id="targetGender"><option value="any">Любого</option><option value="male">Парня</option><option value="female">Девушку</option></select>
                        <select id="targetAge"><option value="any">Любой возраст</option><option value="1">до 18</option><option value="2">18-25</option><option value="3">25+</option></select>
                    </div>
                    <button id="startBtn">ВОЙТИ В ЧАТ</button>
                </div>
            </div>

            <div id="chat-screen" class="hidden">
                <div id="chat-messages"></div>
                <!-- Индикатор твоего микрофона -->
                <div id="mic-indicator"><div id="mic-level"></div></div>
                
                <div class="bottom-bar">
                    <button class="game-btn" onclick="toggleGame()">🎮</button>
                    <div class="inp-wrap">
                        <input type="text" id="msgInput" placeholder="Сообщение...">
                        <button id="sendBtn">➤</button>
                    </div>
                </div>
                <button id="nextBtn">СЛЕДУЮЩИЙ</button>
            </div>

            <div id="game-overlay" class="hidden">
                <div class="g-nav">
                    <span id="g-score">0</span>
                    <button onclick="toggleGame()">✖</button>
                </div>
                <canvas id="gameCanvas" width="300" height="400"></canvas>
            </div>
        </div>

        <div class="leaderboard">
            <strong>РЕКОРДЫ FLAPPY</strong>
            <div id="leader-list"></div>
        </div>
    </div>
    <audio id="remoteAudio" autoplay playsinline></audio>
    <script src="client.js"></script>
</body>
</html>
